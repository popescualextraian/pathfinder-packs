# Copy to your vault root as `.vault.yaml` and edit as needed.
# All keys are optional; this file shows the defaults librarian falls back to.

# Where source files land for ingestion. The only directory librarian
# requires; it will not be created automatically — make it yourself.
# Leading underscore is intentional: sorts to the top, and Obsidian-style
# tools hide underscore-prefixed folders from the main view.
raw_dir: _raw

# Where ingested originals are moved after successful conversion.
# Set to `null` to leave originals in place after ingest.
processed_raw: _raw/_done

# How standalone images dropped in the raw dir are treated:
#   describe   — generate a 1–3 sentence sidecar description, index the sidecar
#   store-only — move the image file but skip description and indexing
image_handling: describe
